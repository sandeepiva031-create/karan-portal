<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAARAN - Farmer & Scheme Action Network</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🌾 KAARAN Portal</h1>
    <p>Kisan & Government Application Resource and Action Network</p>
  </header>

  <main>
    <!-- Status Tracker -->
    <section class="card">
      <h2>🔍 Application Status Tracker</h2>
      <div class="input-group">
        <input type="text" id="appId" placeholder="Enter Application Reference (e.g. PMK123456, KCC987654)">
        <button onclick="checkStatus()">Check Status</button>
      </div>
      <div id="statusResult" class="result-box"></div>
    </section>

    <!-- AI Rejection Diagnostic Assistant -->
    <section class="card">
      <h2>🤖 AI Rejection Solution Assistant</h2>
      <div class="form-group">
        <label>Yojna Name:</label>
        <select id="schemeSelect">
          <option value="PM-Kisan Samman Nidhi">PM-Kisan Samman Nidhi</option>
          <option value="Kisan Credit Card (KCC)">Kisan Credit Card (KCC)</option>
          <option value="PM Fasal Bima Yojana">PM Fasal Bima Yojana</option>
        </select>
      </div>
      <div class="form-group">
        <label>Rejection / Issue Reason:</label>
        <input type="text" id="rejectionInput" placeholder="e.g. NPCI Inactive, Land Seeding No, Name Mismatch">
      </div>
      <button onclick="diagnoseIssue()">Diagnose & Get Solution (Local AI)</button>
      <div id="aiResult" class="result-box"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
